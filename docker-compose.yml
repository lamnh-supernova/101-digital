services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: simple_invoice
      POSTGRES_USER: simple_invoice
      POSTGRES_PASSWORD: simple_invoice
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U simple_invoice']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://simple_invoice:simple_invoice@postgres:5432/simple_invoice
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret-before-any-real-deploy}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-reviewer@simpleinvoice.test}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-ReviewerPass123!}
      SEED_USER_FULLNAME: ${SEED_USER_FULLNAME:-Assessment Reviewer}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* variables are inlined into the client bundle at build
      # time, so this must be passed as a build arg, not a runtime env var.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  postgres-data:
